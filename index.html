
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0b">
<title>SUB 60 IMPOSSIBLE YASSINE</title>
<style>
:root{--red:#ed1027;--bg:#090a0b;--panel:#121416;--card:#191c1f;--line:#303438;--muted:#a9afb5;--white:#f7f7f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{padding:28px 20px;background:radial-gradient(ellipse at 75% 50%,#4b1017,#0b0b0c 65%);border-bottom:3px solid #292929;display:flex;align-items:center;gap:16px}
.logo{font-size:42px;color:var(--red);font-weight:1000}
h1{font-size:clamp(25px,5vw,42px);font-style:italic;line-height:.95;margin:0;font-weight:1000}
h1 span{display:block;color:var(--red);margin-top:7px}
.yassine{display:inline-block;background:var(--red);padding:5px 13px;margin-top:10px;letter-spacing:4px;font-weight:900}
.tagline{font-size:10px;color:#bbb;letter-spacing:3px;margin-top:12px}
main{max-width:1200px;margin:auto;padding:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.tab,.btn{border:1px solid #383b3e;border-radius:12px;padding:13px;background:#191b1d;color:#fff;font-weight:800}
.tab.active,.btn.primary{background:var(--red);border-color:var(--red)}
.layout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px}
.panel{background:linear-gradient(145deg,#121416,#0b0c0d);border:1px solid #2d3033;border-radius:16px;padding:14px;min-width:0}
input,select{background:#101112;color:white;border:1px solid #3c4044;border-radius:10px;padding:12px;width:100%;min-width:0}
.search{margin-bottom:10px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.status-text{font-size:12px;color:#bbb;margin:10px 0 15px;line-height:1.5}
.section-title{font-weight:900;margin:12px 0;color:var(--red)}
.exercise-list{display:flex;flex-direction:column;gap:8px}
.exercise{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:#191c1f;color:white;border:1px solid #303438;border-radius:12px;padding:9px}
.exercise.selected{border-color:var(--red);background:#291418}
.exercise img{width:68px;height:68px;object-fit:cover;background:#252525;border-radius:9px;flex-shrink:0}
.ex-copy{flex:1;min-width:0}
.ex-copy strong{display:block;font-size:14px;line-height:1.3}
.ex-copy small{display:block;color:#b5bbc0;font-size:11px;margin-top:5px}
.detail-top{display:grid;grid-template-columns:minmax(100px,.85fr) 1fr;gap:12px;align-items:start}
.detail-top img{width:100%;aspect-ratio:1;object-fit:cover;background:#252525;border-radius:12px}
h2{font-size:22px;margin:3px 0 8px}
.muted{font-size:12px;color:#bdc1c5;line-height:1.5}
.pill{display:inline-block;color:#ff5264;font-size:11px;font-weight:800;margin-top:9px}
.box{border:1px solid #303438;border-radius:12px;padding:12px;margin-top:14px}
.box-title{color:#ff5264;font-weight:900;font-size:13px;margin-bottom:12px}
.set-row{display:grid;grid-template-columns:48px 1fr 30px;gap:7px;align-items:center;margin-bottom:8px}
.set-num{font-size:12px;font-weight:800}
.values{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.field label{font-size:10px;color:#bbb;display:block;margin:0 0 4px}
.field input{text-align:center;padding:10px 4px}
.remove{background:transparent;border:0;color:#ff5264;font-size:21px}
.btn{margin-top:10px}
.btn.full{width:100%}
.btn.secondary{width:100%;background:#191b1d}
.save{width:100%;margin-top:13px;padding:15px}
.saved-list{display:flex;flex-direction:column;gap:9px}
.saved-item{display:flex;align-items:center;gap:10px;background:#191c1f;border:1px solid #303438;border-radius:12px;padding:10px}
.saved-item img{width:58px;height:58px;object-fit:cover;border-radius:8px}
.saved-copy{flex:1;min-width:0}
.saved-copy strong{display:block;font-size:13px}
.saved-copy small{display:block;color:#bbb;font-size:11px;margin-top:5px;line-height:1.4}
.saved-item button{padding:9px;font-size:12px}
.empty{color:#aaa;text-align:center;padding:22px 8px;font-size:13px}
.toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#193425;border:1px solid #29824a;color:#fff;padding:13px 17px;border-radius:12px;z-index:5;max-width:90%;text-align:center}
footer{text-align:center;color:#777;font-size:10px;letter-spacing:2px;padding:22px}
[hidden]{display:none!important}
.add-form{border:1px solid #45494e;background:#151719;padding:12px;border-radius:12px;margin:10px 0 14px}
.add-form label{display:block;color:#c5c9cd;font-size:12px;margin:10px 0 5px}
.add-form input,.add-form select{margin-bottom:3px}
.add-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.add-actions .btn{margin-top:0}
@media(max-width:760px){header{padding:22px 14px}.logo{font-size:32px}main{padding:10px}.layout{grid-template-columns:1fr}.panel{padding:12px}.exercise img{width:60px;height:60px}.detail-top{grid-template-columns:110px 1fr}h2{font-size:20px}}
</style>
</head>
<body>
<header>
  <div class="logo">▰</div>
  <div>
    <h1>SUB 60 <span>IMPOSSIBLE</span></h1>
    <div class="yassine">YASSINE</div>
    <div class="tagline">STRENGTH TRACKER</div>
  </div>
</header>

<main>
  <nav class="tabs">
    <button class="tab active" id="tabExercises" type="button">🏋 Exercices</button>
    <button class="tab" id="tabSaved" type="button">▣ Mes charges</button>
  </nav>

  <div class="layout">
    <section class="panel" id="catalogPanel">
      <input class="search" id="search" type="search" placeholder="Rechercher en français ou en anglais…" autocomplete="off">
      <div class="filters">
        <select id="muscleFilter"><option value="">Tous les muscles</option></select>
        <select id="equipmentFilter"><option value="">Tous les équipements</option></select>
      </div>
      <div class="status-text" id="databaseStatus">Chargement de la bibliothèque…</div>
      <div class="section-title">♨ BIBLIOTHÈQUE D'EXERCICES</div>

      <button class="btn primary full" id="showAddExercise" type="button">＋ AJOUTER MON EXERCICE</button>

      <form class="add-form" id="addExerciseForm" hidden>
        <div class="box-title">＋ CRÉER UN EXERCICE PERSONNALISÉ</div>
        <label for="customName">Nom de l'exercice *</label>
        <input id="customName" required maxlength="80" placeholder="Ex. : Tirage à la machine spéciale">

        <label for="customEnglish">Nom anglais (facultatif)</label>
        <input id="customEnglish" maxlength="80" placeholder="Ex. : Custom Machine Row">

        <label for="customMuscle">Muscle travaillé</label>
        <select id="customMuscle">
          <option>Autres</option>
          <option>Pectoraux</option>
          <option>Dos</option>
          <option>Épaules</option>
          <option>Biceps</option>
          <option>Triceps</option>
          <option>Quadriceps</option>
          <option>Ischio-jambiers</option>
          <option>Fessiers</option>
          <option>Mollets</option>
          <option>Abdominaux</option>
          <option>Avant-bras</option>
          <option>Corps entier</option>
        </select>

        <label for="customEquipment">Équipement</label>
        <select id="customEquipment">
          <option>Machine</option>
          <option>Poulie</option>
          <option>Haltères</option>
          <option>Barre</option>
          <option>Poids du corps</option>
          <option>Élastiques</option>
          <option>Kettlebell</option>
          <option>Autre</option>
        </select>

        <label for="customImage">Lien de l'image (facultatif)</label>
        <input id="customImage" type="url" placeholder="https://...">

        <div class="add-actions">
          <button class="btn primary" type="submit">Créer l'exercice</button>
          <button class="btn secondary" id="cancelAddExercise" type="button">Annuler</button>
        </div>
        <div class="status-text">Ton exercice sera conservé dans ce navigateur et pourra être utilisé comme les autres.</div>
      </form>

      <div class="exercise-list" id="exerciseList"></div>
    </section>

    <section class="panel" id="detailPanel">
      <div id="detailContent"></div>
    </section>

    <section class="panel" id="savedPanel" hidden>
      <div class="section-title">▣ MES DERNIÈRES CHARGES</div>
      <div class="saved-list" id="savedList"></div>
    </section>
  </div>
</main>

<footer>DISCIPLINE AUJOURD'HUI · RÉSULTATS DEMAIN</footer>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

const STORAGE_KEY = "sub60YassineChargesV2";
const SELECTED_KEY = "sub60YassineSelectedV2";
const CUSTOM_KEY = "sub60YassineCustomExercisesV1";
const DB_URL = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json";
const IMG_BASE = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";

const fallbackImage = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180"><rect width="240" height="180" fill="#202326"/><text x="120" y="83" fill="#ed1027" font-size="23" font-weight="bold" text-anchor="middle" font-family="Arial">SUB 60</text><text x="120" y="112" fill="#dddddd" font-size="12" text-anchor="middle" font-family="Arial">EXERCICE</text></svg>'
);

const starter = [
  ["leg-press","Presse à cuisses","Leg Press","Quadriceps","Machine","Lever Leg Press"],
  ["chest-press","Développé à la machine","Machine Chest Press","Pectoraux","Machine","Chest Press"],
  ["lat-pulldown","Tirage vertical","Lat Pulldown","Dos","Machine","Lat Pulldown"],
  ["seated-row","Tirage horizontal","Seated Cable Row","Dos","Poulie","Seated Cable Row"],
  ["butterfly","Pec deck / Butterfly","Butterfly","Pectoraux","Machine","Butterfly"],
  ["shoulder-press","Développé épaules","Shoulder Press","Épaules","Machine","Shoulder Press"],
  ["leg-extension","Extension des jambes","Leg Extension","Quadriceps","Machine","Leg Extension"],
  ["leg-curl","Flexion des jambes","Leg Curl","Ischio-jambiers","Machine","Lying Leg Curl"],
  ["cable-pushdown","Extension triceps à la poulie","Triceps Pushdown","Triceps","Poulie","Triceps Pushdown"],
  ["biceps-curl","Curl biceps","Biceps Curl","Biceps","Haltères","Dumbbell Biceps Curl"],
  ["lateral-raise","Élévations latérales","Lateral Raise","Épaules","Haltères","Side Lateral Raise"],
  ["cable-fly","Écartés à la poulie","Cable Fly","Pectoraux","Poulie","Cable Crossover"],
  ["bench-press","Développé couché","Barbell Bench Press","Pectoraux","Barre","Barbell Bench Press"],
  ["incline-press","Développé incliné","Incline Dumbbell Press","Pectoraux","Haltères","Incline Dumbbell Press"],
  ["squat","Squat","Barbell Squat","Quadriceps","Barre","Barbell Full Squat"],
  ["deadlift","Soulevé de terre","Deadlift","Dos / jambes","Barre","Barbell Deadlift"],
  ["hip-thrust","Hip thrust","Barbell Hip Thrust","Fessiers","Barre","Barbell Hip Thrust"],
  ["calf-raise","Extensions mollets","Standing Calf Raise","Mollets","Machine","Standing Calf Raises"],
  ["pullup","Tractions","Pull-Up","Dos","Poids du corps","Pull-Up"],
  ["dip","Dips","Dips","Triceps / pectoraux","Poids du corps","Dips"],
  ["pushup","Pompes","Push-Up","Pectoraux","Poids du corps","Push-Up"],
  ["plank","Gainage planche","Plank","Abdominaux","Poids du corps","Plank"],
  ["crunch","Crunch abdominal","Crunch","Abdominaux","Poids du corps","Crunch"],
  ["lunge","Fentes","Lunge","Quadriceps / fessiers","Haltères","Dumbbell Lunge"],
  ["seated-calf","Mollets assis","Seated Calf Raise","Mollets","Machine","Seated Calf Raise"],
  ["adductor","Machine adducteurs","Hip Adduction","Adducteurs","Machine","Adductor"],
  ["abductor","Machine abducteurs","Hip Abduction","Abducteurs","Machine","Abductor"],
  ["assisted-dip","Dips assistés","Assisted Dip","Triceps / pectoraux","Machine","Assisted Dip"],
  ["assisted-pullup","Tractions assistées","Assisted Pull-Up","Dos","Machine","Assisted Pull-Up"],
  ["preacher-curl","Curl pupitre","Preacher Curl","Biceps","Machine","Preacher Curl"]
].map(([id,name,englishName,muscles,machine,match]) => ({
  id,name,englishName,muscles,machine,match,
  description:"Effectue le mouvement avec contrôle et choisis une charge adaptée.",
  image:fallbackImage
}));

let exercises = starter.slice();
let saved = {};
let selectedId = "";
let currentSets = [];
let activeTab = "exercises";

const $ = id => document.getElementById(id);

function normalize(value) {
  return String(value || "").normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").toLowerCase()
    .replace(/[^a-z0-9]+/g," ").trim();
}

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function loadSavedData() {
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    if (!saved || typeof saved !== "object" || Array.isArray(saved)) saved = {};
  } catch (e) { saved = {}; }

  try { selectedId = localStorage.getItem(SELECTED_KEY) || ""; }
  catch (e) { selectedId = ""; }
}

function loadCustomExercises() {
  try {
    const custom = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]");
    if (!Array.isArray(custom)) return;

    custom.forEach(ex => {
      if (!ex || !ex.id || !ex.name) return;
      if (ex.id.startsWith("custom-") && !exercises.some(item => item.id === ex.id)) {
        exercises.push(ex);
      }
    });
  } catch (error) {
    console.warn("Impossible de charger les exercices personnalisés",error);
  }
}

function getExercise(id) {
  return exercises.find(ex => ex.id === id) || exercises[0];
}

function defaultSets() {
  return [
    {weight:"",reps:""},
    {weight:"",reps:""},
    {weight:"",reps:""}
  ];
}

function imageHTML(ex) {
  const url = ex.image || fallbackImage;
  return `<img src="${safe(url)}" alt="${safe(ex.name)}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackImage}'">`;
}

function setupFilters() {
  const muscle = $("muscleFilter");
  const equipment = $("equipmentFilter");
  const oldMuscle = muscle.value;
  const oldEquipment = equipment.value;

  const muscles = [...new Set(exercises.map(ex => ex.muscles).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b,"fr"));
  const machines = [...new Set(exercises.map(ex => ex.machine).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b,"fr"));

  muscle.innerHTML = '<option value="">Tous les muscles</option>' +
    muscles.map(v => `<option value="${safe(v)}">${safe(v)}</option>`).join("");
  equipment.innerHTML = '<option value="">Tous les équipements</option>' +
    machines.map(v => `<option value="${safe(v)}">${safe(v)}</option>`).join("");

  if (muscles.includes(oldMuscle)) muscle.value = oldMuscle;
  if (machines.includes(oldEquipment)) equipment.value = oldEquipment;
}

function renderExerciseList() {
  const query = normalize($("search").value);
  const muscle = $("muscleFilter").value;
  const equipment = $("equipmentFilter").value;

  const filtered = exercises.filter(ex => {
    const words = normalize([
      ex.name,ex.englishName,ex.machine,ex.muscles,ex.equipment,ex.match
    ].join(" "));
    return (!query || words.includes(query)) &&
      (!muscle || ex.muscles === muscle) &&
      (!equipment || ex.machine === equipment);
  });

  $("exerciseList").innerHTML = filtered.length ? filtered.map(ex => `
    <button type="button" class="exercise ${ex.id===selectedId?"selected":""}" data-id="${safe(ex.id)}">
      ${imageHTML(ex)}
      <span class="ex-copy">
        <strong>${safe(ex.name)}</strong>
        <small>${safe(ex.englishName)}<br>${safe(ex.machine)} · ${safe(ex.muscles)}</small>
      </span>
      <span aria-hidden="true">›</span>
    </button>`).join("") :
    '<div class="empty">Aucun exercice trouvé. Essaie un autre mot.</div>';

  $("exerciseList").querySelectorAll("[data-id]").forEach(button => {
    button.addEventListener("click", () => selectExercise(button.dataset.id));
  });
}

function selectExercise(id) {
  const ex = exercises.find(item => item.id === id);
  if (!ex) return;

  selectedId = ex.id;
  try { localStorage.setItem(SELECTED_KEY, selectedId); } catch(e) {}

  const previous = saved[selectedId]?.sets;
  currentSets = Array.isArray(previous)
    ? previous.map(s => ({weight:String(s.weight ?? ""),reps:String(s.reps ?? "")}))
    : defaultSets();

  showTab("exercises");
  renderExerciseList();
  renderDetail();
}

function renderDetail() {
  const ex = getExercise(selectedId);
  if (!ex) return;

  const latest = saved[ex.id]?.sets;
  $("detailContent").innerHTML = `
    <div class="detail-top">
      ${imageHTML(ex)}
      <div>
        <h2>${safe(ex.name)}</h2>
        <div class="muted">${safe(ex.englishName || ex.name)}</div>
        <div class="muted" style="margin-top:8px">${safe(ex.machine)} · ${safe(ex.muscles)}</div>
        <div class="pill">♨ ${safe(String(ex.muscles).toUpperCase())}</div>
        <p class="muted">${safe(ex.description || "Effectue le mouvement avec contrôle et choisis une charge adaptée.")}</p>
        ${ex.custom ? '<div class="pill">✦ EXERCICE PERSONNALISÉ</div>' : ''}
      </div>
    </div>

    <div class="box">
      <div class="box-title">▣ DERNIÈRES CHARGES ENREGISTRÉES</div>
      ${latest && latest.length ? latest.map((s,i) => `
        <div class="set-row">
          <span class="set-num">Série ${i+1}</span>
          <div class="values">
            <div class="field"><label>Poids</label><input value="${safe(s.weight)} kg" readonly></div>
            <div class="field"><label>Répétitions</label><input value="${safe(s.reps)} reps" readonly></div>
          </div><span></span>
        </div>`).join("") :
        '<div class="muted">Aucune charge enregistrée pour cet exercice.</div>'}
    </div>

    <div class="box">
      <div class="box-title">✎ MODIFIER MES CHARGES</div>
      <div class="set-row">
        <span class="set-num">Série</span>
        <div class="values"><div class="field"><label>Poids (kg)</label></div><div class="field"><label>Répétitions</label></div></div>
        <span></span>
      </div>
      <div id="editableSets">
        ${currentSets.map((s,i) => setRowHTML(s,i)).join("")}
      </div>
      <button class="btn secondary" id="addSet" type="button">＋ Ajouter une série</button>
    </div>

    <button class="btn primary save" id="saveSets" type="button">▣ ENREGISTRER MES CHARGES</button>
    <div class="status-text">Les modifications sont enregistrées sur ce téléphone.</div>
  `;

  $("editableSets").querySelectorAll("input").forEach(input => {
    input.addEventListener("input", () => {
      const index = Number(input.dataset.index);
      const key = input.dataset.key;
      if (currentSets[index]) currentSets[index][key] = input.value;
    });
  });

  $("editableSets").querySelectorAll("[data-remove]").forEach(button => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.remove);
      currentSets.splice(index,1);
      if (!currentSets.length) currentSets.push({weight:"",reps:""});
      renderDetail();
    });
  });

  $("addSet").addEventListener("click", () => {
    currentSets.push({weight:"",reps:""});
    renderDetail();
  });

  $("saveSets").addEventListener("click", saveCurrentSets);
}

function setRowHTML(set,index) {
  return `<div class="set-row">
    <span class="set-num">Série ${index+1}</span>
    <div class="values">
      <div class="field"><input inputmode="decimal" aria-label="Poids série ${index+1}" data-index="${index}" data-key="weight" placeholder="kg" value="${safe(set.weight)}"></div>
      <div class="field"><input inputmode="numeric" aria-label="Répétitions série ${index+1}" data-index="${index}" data-key="reps" placeholder="reps" value="${safe(set.reps)}"></div>
    </div>
    <button class="remove" type="button" data-remove="${index}" aria-label="Supprimer la série">×</button>
  </div>`;
}

function saveCurrentSets() {
  const inputs = $("editableSets").querySelectorAll("input");
  inputs.forEach(input => {
    const i = Number(input.dataset.index);
    const key = input.dataset.key;
    if (currentSets[i]) currentSets[i][key] = input.value;
  });

  const cleaned = currentSets.map(set => ({
    weight:String(set.weight ?? "").trim(),
    reps:String(set.reps ?? "").trim()
  })).filter(set => set.weight !== "" || set.reps !== "");

  if (!cleaned.length) {
    showToast("Entre au moins un poids ou un nombre de répétitions.");
    return;
  }

  saved[selectedId] = {sets:cleaned};

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    localStorage.setItem(SELECTED_KEY, selectedId);
  } catch (error) {
    showToast("Sauvegarde impossible : vérifie les réglages du navigateur.");
    return;
  }

  currentSets = cleaned.map(set => ({...set}));
  renderDetail();
  renderSavedList();
  renderExerciseList();
  showToast("Modifications enregistrées !");
}

function renderSavedList() {
  const entries = exercises.filter(ex =>
    saved[ex.id] && Array.isArray(saved[ex.id].sets)
  );

  $("savedList").innerHTML = entries.length ? entries.map(ex => {
    const summary = saved[ex.id].sets.map((s,i) =>
      `S${i+1} : ${s.weight || "—"} kg × ${s.reps || "—"} reps`
    ).join(" · ");

    return `<div class="saved-item">
      ${imageHTML(ex)}
      <div class="saved-copy">
        <strong>${safe(ex.name)}</strong>
        <small>${safe(summary)}</small>
      </div>
      <button class="btn" type="button" data-edit="${safe(ex.id)}">Modifier</button>
    </div>`;
  }).join("") :
  '<div class="empty">Aucune charge enregistrée pour le moment.</div>';

  $("savedList").querySelectorAll("[data-edit]").forEach(button => {
    button.addEventListener("click", () => selectExercise(button.dataset.edit));
  });
}

function showTab(tab) {
  activeTab = tab;
  const savedTab = tab === "saved";

  $("tabExercises").classList.toggle("active",!savedTab);
  $("tabSaved").classList.toggle("active",savedTab);
  $("catalogPanel").hidden = savedTab;
  $("detailPanel").hidden = savedTab;
  $("savedPanel").hidden = !savedTab;

  if (savedTab) renderSavedList();
}

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.style.display = "block";
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.style.display = "none",2500);
}

function openAddExerciseForm() {
  $("addExerciseForm").hidden = false;
  $("customName").focus();
}

function closeAddExerciseForm() {
  $("addExerciseForm").reset();
  $("addExerciseForm").hidden = true;
}

function saveCustomExercises() {
  try {
    const custom = exercises.filter(ex => ex.custom);
    localStorage.setItem(CUSTOM_KEY,JSON.stringify(custom));
    return true;
  } catch (error) {
    showToast("Impossible de sauvegarder : espace de stockage insuffisant.");
    return false;
  }
}

function createCustomExercise(event) {
  event.preventDefault();

  const name = $("customName").value.trim();
  if (!name) {
    showToast("Donne un nom à ton exercice.");
    return;
  }

  const englishName = $("customEnglish").value.trim() || name;
  const muscles = $("customMuscle").value || "Autres";
  const machine = $("customEquipment").value || "Autre";
  const image = $("customImage").value.trim() || fallbackImage;

  const id = "custom-" + Date.now().toString(36) + "-" +
    Math.random().toString(36).slice(2,7);

  const exercise = {
    id,
    name,
    englishName,
    muscles,
    machine,
    equipment:machine,
    match:englishName,
    description:"Exercice personnalisé. Note tes charges, tes répétitions et ajoute autant de séries que nécessaire.",
    image,
    custom:true
  };

  exercises.push(exercise);

  if (!saveCustomExercises()) {
    exercises = exercises.filter(ex => ex.id !== id);
    return;
  }

  setupFilters();
  $("search").value = "";
  $("muscleFilter").value = "";
  $("equipmentFilter").value = "";
  closeAddExerciseForm();
  selectExercise(id);
  renderSavedList();
  showToast("Exercice créé ! Tu peux maintenant saisir tes charges.");
}

$("showAddExercise").addEventListener("click",openAddExerciseForm);
$("cancelAddExercise").addEventListener("click",closeAddExerciseForm);
$("addExerciseForm").addEventListener("submit",createCustomExercise);

function translateEquipment(value) {
  const key = normalize(value);
  const map = {
    "machine":"Machine","cable":"Poulie","barbell":"Barre",
    "dumbbell":"Haltères","body only":"Poids du corps",
    "bodyweight":"Poids du corps","bands":"Élastiques",
    "kettlebells":"Kettlebell","medicine ball":"Medecine ball",
    "exercise ball":"Ballon de gym","foam roll":"Rouleau de massage",
    "e z curl bar":"Barre EZ","other":"Autre","none":"Poids du corps"
  };
  return map[key] || value || "Autre";
}

function frenchName(english) {
  const key = normalize(english);
  const translations = {
    "barbell bench press":"Développé couché à la barre",
    "barbell squat":"Squat à la barre",
    "barbell full squat":"Squat complet à la barre",
    "barbell deadlift":"Soulevé de terre",
    "dumbbell biceps curl":"Curl biceps aux haltères",
    "dumbbell curl":"Curl aux haltères",
    "incline dumbbell press":"Développé incliné aux haltères",
    "lat pulldown":"Tirage vertical",
    "seated cable row":"Tirage horizontal à la poulie",
    "triceps pushdown":"Extension triceps à la poulie",
    "side lateral raise":"Élévations latérales",
    "cable crossover":"Écartés à la poulie",
    "lying leg curl":"Leg curl allongé",
    "standing calf raises":"Extensions mollets debout",
    "plank":"Gainage planche",
    "push up":"Pompes",
    "pull up":"Tractions",
    "crunch":"Crunch abdominal"
  };
  return translations[key] || english;
}

async function loadExerciseDatabase() {
  const status = $("databaseStatus");
  try {
    const response = await fetch(DB_URL);
    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    const records = Array.isArray(data) ? data :
      (Array.isArray(data.exercises) ? data.exercises : []);

    if (!records.length) throw new Error("Base vide");

    let added = 0;
    const known = new Set(exercises.map(ex => normalize(ex.englishName)));

    for (const item of records) {
      if (!item || !item.name) continue;
      const englishName = String(item.name).trim();
      const key = normalize(englishName);
      if (!key || known.has(key)) continue;

      const rawImage = Array.isArray(item.images)
        ? item.images.find(path => typeof path === "string" && /\.(jpg|jpeg|png|webp)$/i.test(path))
        : null;

      const image = rawImage
        ? IMG_BASE + rawImage.split("/").map(encodeURIComponent).join("/")
        : fallbackImage;

      const muscleNames = Array.isArray(item.primaryMuscles) && item.primaryMuscles.length
        ? item.primaryMuscles.map(m => String(m).replace(/[_-]/g," "))
        : ["Autres"];

      const equipmentRaw = String(item.equipment || "other").replace(/[_-]/g," ");
      const id = "db-" + String(item.id || key).toLowerCase().replace(/[^a-z0-9]+/g,"-");

      if (exercises.some(ex => ex.id === id)) continue;

      exercises.push({
        id,
        name:frenchName(englishName),
        englishName,
        muscles:muscleNames.join(", "),
        machine:translateEquipment(equipmentRaw),
        equipment:equipmentRaw,
        description:"Exercice issu de la bibliothèque. Contrôle le mouvement et adapte la charge à ton niveau.",
        image
      });

      known.add(key);
      added++;
    }

    setupFilters();
    renderExerciseList();
    renderSavedList();

    status.textContent = exercises.length + " exercices disponibles. " +
      added + " exercices supplémentaires chargés. Recherche en français ou en anglais.";

    if (selectedId && exercises.some(ex => ex.id === selectedId)) {
      renderDetail();
    }
  } catch (error) {
    console.warn("Base en ligne indisponible",error);
    status.textContent = "Bibliothèque en ligne indisponible. Les exercices de base restent disponibles.";
  }
}

$("search").addEventListener("input",renderExerciseList);
$("muscleFilter").addEventListener("change",renderExerciseList);
$("equipmentFilter").addEventListener("change",renderExerciseList);
$("tabExercises").addEventListener("click",() => showTab("exercises"));
$("tabSaved").addEventListener("click",() => showTab("saved"));

loadSavedData();
loadCustomExercises();
setupFilters();

if (!selectedId || !exercises.some(ex => ex.id === selectedId)) {
  selectedId = exercises[0].id;
}
selectExercise(selectedId);
loadExerciseDatabase();
</script>
